<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Router-Lite 管理面板 - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link id="remixicon-css" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>AI-Router</h1>
                <span class="version">v0.9.2</span>
            </div>
            
            <!-- 初始化表单（首次设置密码） -->
            <div id="init-form" class="login-form" style="display: none;">
                <h2>初始化管理员账户</h2>
                <p class="form-desc">首次使用，请设置管理员密码</p>
                <form onsubmit="Auth.handleInit(event)">
                    <div class="form-group">
                        <label for="init-password">设置密码</label>
                        <div class="input-wrapper">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="init-password" placeholder="请输入密码（至少6位）" required minlength="6">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="init-password-confirm">确认密码</label>
                        <div class="input-wrapper">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="init-password-confirm" placeholder="请再次输入密码" required minlength="6">
                        </div>
                    </div>
                    <div id="init-error" class="error-message" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <span class="btn-text">设置密码并进入</span>
                        <span class="btn-loading" style="display: none;"><i class="ri-loader-4-line spin"></i></span>
                    </button>
                </form>
            </div>
            
            <!-- 登录表单 -->
            <div id="login-form" class="login-form" style="display: none;">
                <h2>管理面板登录</h2>
                <form onsubmit="Auth.handleLogin(event)">
                    <div class="form-group">
                        <label for="login-password">管理员密码</label>
                        <div class="input-wrapper">
                            <i class="ri-lock-line"></i>
                            <input type="password" id="login-password" placeholder="请输入密码" required>
                        </div>
                    </div>
                    <div id="login-error" class="error-message" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <span class="btn-text">登录</span>
                        <span class="btn-loading" style="display: none;"><i class="ri-loader-4-line spin"></i></span>
                    </button>
                </form>
            </div>
            
            <!-- 加载状态 -->
            <div id="loading-state" class="loading-state">
                <i class="ri-loader-4-line spin"></i>
                <span>正在检查认证状态...</span>
            </div>
        </div>
        
        <div class="login-footer">
            <p>AI-Router-Lite &copy; 2024</p>
        </div>
    </div>

    <script>
        const Auth = {
            /**
             * 公共请求函数
             * @param {string} url - 请求 URL
             * @param {Object} options - fetch 选项（可选）
             * @returns {Promise<{ok: boolean, data: any, error?: string}>}
             */
            async request(url, options = {}) {
                try {
                    const response = await fetch(url, {
                        ...options,
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        }
                    });

                    let data;
                    try {
                        data = await response.json();
                    } catch {
                        return { ok: false, data: null, error: '服务器响应格式错误' };
                    }

                    const unwrapped = data.data !== undefined ? data.data : data;

                    if (!response.ok) {
                        const errMsg = data.error?.message || data.detail || '请求失败';
                        return { ok: false, data: unwrapped, error: errMsg };
                    }

                    return { ok: true, data: unwrapped };
                } catch (error) {
                    console.error('Request failed:', error);
                    return { ok: false, data: null, error: '网络错误，请重试' };
                }
            },

            /** 设置按钮加载状态 */
            setButtonLoading(btn, loading) {
                btn.querySelector('.btn-text').style.display = loading ? 'none' : 'inline';
                btn.querySelector('.btn-loading').style.display = loading ? 'inline-block' : 'none';
                btn.disabled = loading;
            },

            /** 显示错误信息 */
            showError(el, message) {
                el.textContent = message;
                el.style.display = 'block';
            },

            async init() {
                const result = await this.request('/api/auth/status');
                const loadingState = document.getElementById('loading-state');

                loadingState.style.display = 'none';

                if (!result.ok) {
                    loadingState.style.display = 'block';
                    loadingState.innerHTML = '<i class="ri-error-warning-line"></i><span></span>';
                    loadingState.querySelector('span').textContent = result.error;
                    return;
                }

                const { initialized, authenticated } = result.data;
                document.getElementById(!initialized ? 'init-form' : authenticated ? '' : 'login-form').style.display = 'block';
                if (initialized && authenticated) window.location.href = '/admin/';
            },

            async handleInit(event) {
                event.preventDefault();

                const password = document.getElementById('init-password').value;
                const confirmPassword = document.getElementById('init-password-confirm').value;
                const errorEl = document.getElementById('init-error');
                const btn = event.target.querySelector('button[type="submit"]');

                if (password !== confirmPassword) {
                    return this.showError(errorEl, '两次输入的密码不一致');
                }
                if (password.length < 6) {
                    return this.showError(errorEl, '密码长度至少6位');
                }

                this.setButtonLoading(btn, true);
                errorEl.style.display = 'none';

                const result = await this.request('/api/auth/init', {
                    method: 'POST',
                    body: JSON.stringify({ password })
                });

                if (result.ok) {
                    window.location.href = '/admin/';
                } else {
                    this.showError(errorEl, result.error);
                    this.setButtonLoading(btn, false);
                }
            },

            async handleLogin(event) {
                event.preventDefault();

                const password = document.getElementById('login-password').value;
                const errorEl = document.getElementById('login-error');
                const btn = event.target.querySelector('button[type="submit"]');

                this.setButtonLoading(btn, true);
                errorEl.style.display = 'none';

                const result = await this.request('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ password })
                });

                if (result.ok) {
                    window.location.href = '/admin/';
                } else {
                    this.showError(errorEl, result.error);
                    this.setButtonLoading(btn, false);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => Auth.init());
    </script>
</body>
</html>
